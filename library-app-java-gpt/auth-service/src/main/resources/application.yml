# application.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: auth_user
    password: change_me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "REPLACE_WITH_A_SECURE_RANDOM_SECRET_AT_LEAST_32_CHARS"
    expiration-ms: 3600000 # 1 hour

logging:
  level:
    root: INFO
    com.example.authservice: DEBUG
