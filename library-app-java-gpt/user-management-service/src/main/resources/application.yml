server:
  port: 8120

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: user_user
    password: change_me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "REPLACE_WITH_A_SECURE_RANDOM_SECRET_AT_LEAST_32_CHARS"
  auth:
    base-url: "http://localhost:8080" # Auth service base URL; change in prod

logging:
  level:
    root: INFO
    com.example.userservice: DEBUG
