server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogdb
    username: catalog_user
    password: change_me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # SHOULD be provided via environment variable in production
    secret: "REPLACE_WITH_A_SECURE_RANDOM_SECRET_AT_LEAST_32_CHARS"
    # we only validate tokens, expiration handling is done in JwtProvider
    allowed-clock-skew-seconds: 60

logging:
  level:
    root: INFO
    com.example.catalogservice: DEBUG
