server:
  port: 8100

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/checkoutdb
    username: checkout_user
    password: change_me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "REPLACE_WITH_A_SECURE_RANDOM_SECRET_AT_LEAST_32_CHARS"
  loan:
    period-days: 14
    max-renewals: 2
  catalog:
    base-url: "http://localhost:8090" # Book Catalog Service base URL

logging:
  level:
    root: INFO
    com.example.checkoutservice: DEBUG
